name: Release

# Publishes Agility.NET.FetchAPI to NuGet when a version tag is pushed, e.g. v3.1.0 or v3.2.0-beta.1.
# The tag must match <Version> in src/Agility.NET.FetchAPI/Agility.NET.FetchAPI.csproj.
#
# Uses NuGet Trusted Publishing (OIDC): no API key is stored. The nuget.org policy (owner Agility-Inc) allows
# this repository's release.yml in the "nuget" environment to push new versions of Agility.NET.FetchAPI only.
# The environment accepts only v* tags and waits for a reviewer's approval.
#
# After the NuGet push, a second job creates the GitHub release for the tag, with that version's CHANGELOG.md section
# as its notes and the packages attached. Only that job can write to the repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      CI: true
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches the project version
        run: |
          version=$(dotnet msbuild src/Agility.NET.FetchAPI/Agility.NET.FetchAPI.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match project version $version."
            exit 1
          fi

      - name: Get the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          # The lines under "## [<version>]", up to the next "## [" heading, without the leading blank line.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && !started && /^[[:space:]]*$/ { next }
            found { started = 1; print }
          ' CHANGELOG.md > artifacts/release-notes.md
          if [ ! -s artifacts/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for $version. Add a \"## [$version]\" section."
            exit 1
          fi

      - name: Build and test
        run: |
          dotnet build -c Release
          dotnet test --no-build -c Release
        env:
          AGILITY_INSTANCE_GUID: ${{ secrets.AGILITY_INSTANCE_GUID }}
          AGILITY_FETCH_API_KEY: ${{ secrets.AGILITY_FETCH_API_KEY }}
          AGILITY_PREVIEW_API_KEY: ${{ secrets.AGILITY_PREVIEW_API_KEY }}

      - name: Pack
        run: dotnet pack src/Agility.NET.FetchAPI/Agility.NET.FetchAPI.csproj --no-build -c Release -o artifacts

      - name: Get a short-lived NuGet API key
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: artifacts/

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: artifacts

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            cat artifacts/release-notes.md
            echo
            echo "**Install:** \`dotnet add package Agility.NET.FetchAPI --version $version\`"
            echo
            echo "Package: https://www.nuget.org/packages/Agility.NET.FetchAPI/$version"
          } > notes.md

          # A re-run of this workflow updates the existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --clobber
          else
            # Versions with a suffix, like 3.2.0-beta.1, are marked as pre-releases.
            prerelease=""
            case "$version" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
              --verify-tag --title "$version" --notes-file notes.md $prerelease
          fi
